name: Repository contracts and reference app

on:
  push:
  pull_request:

# Supersede only older executions of this workflow for the SAME PR. Every push
# has its own group: even pending/active main certifications cannot be cancelled.
concurrency:
  group: build-ci-contracts-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts, reference app, dependencies and SBOM
    runs-on: [self-hosted, flofi-wsl]
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      COREPACK_ENABLE_AUTO_PIN: "0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # The self-hosted runner may host another app server on 3000; the browser suites (critical, guarded and composition steps)
      # serve the reference app on an isolated loopback port (validated by apps/reference-dapp/e2e/app-origin.ts).
      FLOFI_E2E_APP_PORT: '3100'
    # BUILD-CLOUD-001: a disposable PostgreSQL bound to the runner's loopback interface, pinned by digest.
    # Test-only trust authentication; it holds no data beyond the suites' own throwaway databases.
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: flofi
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U flofi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Configure self-hosted temp storage
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          mkdir -p "$RUNNER_TEMP"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'FLOFI_CI_ARCHIVE_CACHE=%s/flofi-ci-archives\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          # Diagnostics only: the persistent runner shares RAM with the RAM-backed /tmp tmpfs.
          free -h
          df -h "$RUNNER_TEMP" /tmp

      - name: Fetch reviewed revision with runner-provided Git
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote remove origin 2>/dev/null || true
          git remote add origin "$SERVER/$REPOSITORY.git"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin "$REVISION"
          git checkout --detach -f FETCH_HEAD
          git clean -ffdx
          unset auth GH_TOKEN

      - name: Start CI resource observations
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh 'After checkout'

      - name: Cache only untrusted raw approved tool archives
        id: archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5; official immutable commit, Node 24
        with:
          path: |
            ${{ runner.temp }}/flofi-ci-archives/node-v24.21.0-linux-x64.tar.xz
            ${{ runner.temp }}/flofi-ci-archives/pnpm-11.22.0.tgz
            ${{ runner.temp }}/flofi-ci-archives/foundry_v1.8.3_linux_amd64.tar.gz
            ${{ runner.temp }}/flofi-ci-archives/chrome-headless-shell-linux64.zip
          # No restore prefixes or executable outputs. Every archive is hashed before parsing.
          key: flofi-archives-v1-${{ runner.os }}-${{ runner.arch }}-node24.21.0-pnpm11.22.0-anvil1.8.3-browser1243-${{ hashFiles('scripts/bootstrap-*.py', 'scripts/ci_archive_cache.py', 'pnpm-lock.yaml', '.npmrc', 'pnpm-workspace.yaml') }}

      - name: Verify and bootstrap exact official Node and pnpm archives
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh 'Toolchain bootstrap'
          python3 scripts/bootstrap-ci.py

      - name: Print exact verified toolchain before installation
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh 'Toolchain identity'
          git --version
          python3 --version
          node --version
          node -p "process.platform+' '+process.arch"
          pnpm --version
          node -p "JSON.parse(require('fs').readFileSync('package.json')).packageManager"
          test "$(node --version)" = "v24.21.0"
          test "$(pnpm --version)" = "11.22.0"

      - name: Frozen install without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh 'Frozen dependency install'
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify every registry integrity, license and release age
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh 'Dependency integrity license and age'
          python3 scripts/bootstrap-ci.py --verify-dependencies

      - name: Dependency audit
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh 'Dependency audit'
          pnpm audit --audit-level low

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh Typecheck
          # Keep Turbo concurrency at 2 on the shared 8 GiB runner.
          pnpm typecheck

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh Lint
          pnpm lint
          pnpm exec eslint scripts/guarded-release-browser.mjs

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh 'Production build'
          pnpm build

      - name: Schema drift
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh 'Schema drift'
          pnpm schemas:check

      - name: Bootstrap exact approved anvil
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh 'Anvil bootstrap'
          python3 scripts/bootstrap-anvil.py "$RUNNER_TEMP/gryloo-anvil/foundry-v1.8.3"

      - name: Bootstrap exact approved headless shell
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh 'Browser bootstrap'
          export BUILD002_BROWSER_CACHE="$RUNNER_TEMP/gryloo-playwright/chromium_headless_shell-1243"
          python3 scripts/bootstrap-playwright.py "$BUILD002_BROWSER_CACHE"

      - name: Run critical browser regressions first (Copilot learning, wallet isolation, Canvas basics, financial Review)
        id: browser-critical
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh 'Critical browser regressions'
          export BUILD002_BROWSER_CACHE="$RUNNER_TEMP/gryloo-playwright/chromium_headless_shell-1243"
          export GRYLOO_ANVIL_BIN="$RUNNER_TEMP/gryloo-anvil/foundry-v1.8.3/anvil"
          export GRYLOO_MODE_A_RUNTIME="$RUNNER_TEMP/gryloo-mode-a-e2e"
          export GRYLOO_COW_RUNTIME="$RUNNER_TEMP/gryloo-cow-e2e"
          # Fail fast: the critical profiles run right after the build, before the unit, PostgreSQL and fork suites.
          node scripts/guarded-release-browser.mjs critical

      - name: Unit and contract tests and exported API checks
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh 'Unit and contract tests'
          python3 scripts/agent_guard.py check
          pnpm test --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/flofi-agent-unit.json"
          python3 scripts/agent_guard.py verify-results "$RUNNER_TEMP/flofi-agent-unit.json"
          python3 scripts/summarize-screenshot-diffs.py --self-test
          test -f packages/reference-linter/dist/index.js
          test -f packages/reference-linter/dist/index.d.ts
          pnpm --filter @defi-workflow-engine/reference-linter exec node --input-type=module -e "const m = await import('@defi-workflow-engine/reference-linter'); for (const key of ['lintWorkflow','validateAuthoringWorkflow','createReviewContext','digestArtifact','digestRawResponse','digestSelfCheck','reviewMockedArtifactChain','mockedSwapOutputs','mockedFixtureBytes','collectBaseTranscript','deriveBaseObservation','reviewBaseObservation']) if (typeof m[key] !== 'function') throw new Error('Missing linter export: '+key); if (!Object.isFrozen(m.MOCKED_CHAIN_PROFILE)) throw new Error('Mocked chain profile must be frozen'); if (!Object.isFrozen(m.BASE_OBSERVATION_PROFILE)) throw new Error('Base observation profile must be frozen'); await m.digestSelfCheck()"

      - name: PostgreSQL durability, concurrency, recovery and tenant-isolation suites (disposable loopback database)
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh 'PostgreSQL'
          export TEST_DATABASE_URL="postgres://flofi@127.0.0.1:5432/postgres"
          pnpm test:postgres --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/flofi-agent-postgres.json"
          python3 scripts/agent_guard.py verify-results --stage postgres "$RUNNER_TEMP/flofi-agent-postgres.json"

      - name: Offline compatibility gate and fork suite
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh 'Anvil and offline forks'
          export GRYLOO_ANVIL_BIN="$RUNNER_TEMP/gryloo-anvil/foundry-v1.8.3/anvil"
          # DEC-0026/DEC-0027: pure G1 checks run; owner-secret pinned-account cases are owner-only local F2 gates.
          pnpm test:anvil
          pnpm test:fork --testTimeout=30000
          # BUILD-003F F1: five fresh-process synthetic rehearsals (MOCKED engineering evidence, loopback only).
          node apps/reference-dapp/e2e/fork/offline-rehearsal.mjs > "$RUNNER_TEMP/build-003f-f1.json"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); if (r.status!=='PASS'||r.passes.length!==5) process.exit(1); console.log('F1 five-pass', r.status, r.passes.map(p=>p.providerEquivalentRequests).join(','))" "$RUNNER_TEMP/build-003f-f1.json"
          # BUILD-003F F4 static check: the committed transcript's structure, digests and identity, never its secret inputs.
          if [ -f apps/reference-dapp/e2e/fork/base-fork-transcript.json ]; then
            node --input-type=module -e "import { readFileSync } from 'node:fs'; import { verifyTranscriptDocument } from './apps/reference-dapp/e2e/fork/replay-upstream.mjs'; import { transcriptIdentity } from './apps/reference-dapp/e2e/fork/harness.mjs'; const t = JSON.parse(readFileSync('apps/reference-dapp/e2e/fork/base-fork-transcript.json', 'utf8')); const counts = verifyTranscriptDocument(t, { accounts: t.identity.accounts }); if (transcriptIdentity({ sourceBlockNumber: t.sourceBlockNumber, sourceBlockHash: t.sourceBlockHash, accounts: t.identity.accounts }).identityHash !== t.identityHash) process.exit(1); console.log('Transcript verified', JSON.stringify(counts));"
          fi
          # BUILD-006: a distinct complete transcript is mandatory for the fork evidence gate.
          # Static validation runs in CI without owner material, provider credentials or external RPC.
          test -f apps/reference-dapp/e2e/fork/liquidity-transcript.json
          node --input-type=module -e "import { readFileSync } from 'node:fs'; import { verifyLiquidityTranscript } from './apps/reference-dapp/e2e/fork/liquidity-replay-upstream.mjs'; const t=JSON.parse(readFileSync('apps/reference-dapp/e2e/fork/liquidity-transcript.json','utf8')); const r=verifyLiquidityTranscript(t,t.identity.accounts); if (t.sourceChainId!==8453 || r.providerRequests<1) process.exit(1); console.log('BUILD-006 closed transcript verified',r.providerRequests,r.localReplies);"
          # BUILD-007 has a separate complete source recording and cannot reuse BUILD-003F or BUILD-006 evidence.
          test -f apps/reference-dapp/e2e/fork/composition-transcript.json
          node --input-type=module -e "import { readFileSync } from 'node:fs'; import { verifyCompositionTranscript } from './apps/reference-dapp/e2e/fork/composition-replay-upstream.mjs'; const t=JSON.parse(readFileSync('apps/reference-dapp/e2e/fork/composition-transcript.json','utf8')); const r=verifyCompositionTranscript(t,t.identity.accounts); if(t.sourceChainId!==8453||r.providerRequests<1||t.codeFingerprints.composition.syntheticCodePins) process.exit(1); console.log('BUILD-007 closed transcript verified',r.providerRequests,r.localReplies);"

      - name: Run guarded browser suite
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh 'Guarded browser suites'
          export BUILD002_BROWSER_CACHE="$RUNNER_TEMP/gryloo-playwright/chromium_headless_shell-1243"
          # BUILD-003F: the browser suite drives the MOCKED synthetic local fork on loopback chain 31337.
          export GRYLOO_ANVIL_BIN="$RUNNER_TEMP/gryloo-anvil/foundry-v1.8.3/anvil"
          export GRYLOO_MODE_A_RUNTIME="$RUNNER_TEMP/gryloo-mode-a-e2e"
          # Approved production Review rejects MOCKED financial authority. Run the current
          # product paths and explicit provenance boundaries in the same profiles as local verification.
          # Positive local financial lifecycle/recovery remains enforced by pnpm test, PostgreSQL
          # and the pinned offline fork gates above; historical browser diagnostics remain intact.
          export GRYLOO_COW_RUNTIME="$RUNNER_TEMP/gryloo-cow-e2e"
          # Every other product profile, including the MCP, developer and channel suites (profiles in the same runner).
          node scripts/guarded-release-browser.mjs extended

      - name: Composition fork and browser suites
        id: composition
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh 'Composition fork and browser'
          export BUILD002_BROWSER_CACHE="$RUNNER_TEMP/gryloo-playwright/chromium_headless_shell-1243"
          export GRYLOO_ANVIL_BIN="$RUNNER_TEMP/gryloo-anvil/foundry-v1.8.3/anvil"
          export GRYLOO_MODE_A_RUNTIME="$RUNNER_TEMP/gryloo-mode-a-e2e"
          export GRYLOO_COW_RUNTIME="$RUNNER_TEMP/gryloo-cow-e2e"
          # BUILD-007: only official digest-pinned test-time artifacts are downloaded, outside Git.
          export GRYLOO_B007_INPUTS="$RUNNER_TEMP/gryloo-build-007-inputs"
          mkdir -p "$GRYLOO_B007_INPUTS"
          python3 - <<'PYCODE'
          import hashlib, os, pathlib, re, tarfile, urllib.request
          root=pathlib.Path(os.environ['GRYLOO_B007_INPUTS'])
          # Roles mastercopies: upstream removed this file from main in d50a1b2 (2026-10-15); fetch the exact bytes from the commit that last changed it (1ddde84db902), digest unchanged.
          sources={
            'safe':('https://registry.npmjs.org/@safe-global/safe-contracts/-/safe-contracts-1.4.1.tgz','8803f7cf26e2c58300b8136342faa7b8bce59436e300f52115fa25b095e0bf79'),
            'roles':('https://raw.githubusercontent.com/gnosisguild/zodiac-modifier-roles/1ddde84db9024c6c1898d1f4cf5dabded3e824f1/packages/evm/mastercopies.json','a80d737a2b5394897fad0aa290b129bc446fdb1736efc3e1ad06edcd2d8ea224'),
          }
          for name,(url,expected) in sources.items():
            raw=urllib.request.urlopen(url,timeout=60).read()
            if hashlib.sha256(raw).hexdigest()!=expected: raise SystemExit('BUILD-007 official artifact digest changed: '+name)
            (root/({'safe':'safe.tgz','roles':'roles-mastercopies.json'}[name])).write_bytes(raw)
          with tarfile.open(root/'safe.tgz','r:gz') as archive:
            archive.extractall(root/'safe',filter='data')
          source=urllib.request.urlopen('https://raw.githubusercontent.com/ethereum/ercs/master/ERCS/erc-2470.md',timeout=60).read().decode()
          matches=[bytes.fromhex(value[2:]) for value in re.findall(r'0x[0-9a-fA-F]{680}',source)]
          init=next((value for value in matches if hashlib.sha256(value).hexdigest()=='dae33ba7a8745a325d78fd9dbf4585b47524070f5c8b73c84bf373e91a24fff6'),None)
          if init is None or len(init)!=340: raise SystemExit('BUILD-007 ERC-2470 initcode pin changed')
          (root/'erc2470-initcode.bin').write_bytes(init)
          PYCODE
          # The disposable executor key must stay under /tmp/ (enforced by the harness and the composition service);
          # it is a few small files and is removed when this step exits so the persistent runner's tmpfs does not fill.
          export GRYLOO_MODE_B_RUNTIME="/tmp/gryloo-b007-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export GRYLOO_MODE_B_SAFE_PACKAGE="$GRYLOO_B007_INPUTS/safe/package"
          export GRYLOO_MODE_B_ROLES_MASTERCOPIES="$GRYLOO_B007_INPUTS/roles-mastercopies.json"
          export GRYLOO_MODE_B_EIP2470_INITCODE="$GRYLOO_B007_INPUTS/erc2470-initcode.bin"
          export GRYLOO_COMPOSITION_INTERIM_TRANSCRIPT_PATH="$PWD/apps/reference-dapp/e2e/fork/composition-transcript.json"
          export GRYLOO_COMPOSITION_INTERIM_TRANSCRIPT_SHA256="$(sha256sum "$GRYLOO_COMPOSITION_INTERIM_TRANSCRIPT_PATH" | cut -d' ' -f1)"
          node apps/reference-dapp/e2e/fork/composition-harness.mjs serve > "$RUNNER_TEMP/gryloo-b007-harness.log" 2>&1 &
          b007_pid=$!
          flofi_ci_cleanup() {
            kill "$b007_pid" 2>/dev/null || true
            rm -rf "$GRYLOO_MODE_B_RUNTIME"
          }
          for attempt in $(seq 1 120); do
            if [ -s "$GRYLOO_MODE_B_RUNTIME/profile.json" ] && [ -s "$GRYLOO_MODE_B_RUNTIME/mode-b-keys.json" ]; then break; fi
            if ! kill -0 "$b007_pid" 2>/dev/null; then cat "$RUNNER_TEMP/gryloo-b007-harness.log"; exit 1; fi
            sleep 1
          done
          test -s "$GRYLOO_MODE_B_RUNTIME/profile.json"
          export GRYLOO_COMPOSITION_PROFILE="$GRYLOO_MODE_B_RUNTIME/profile.json"
          export GRYLOO_COMPOSITION_EXECUTOR_KEY_FILE="$GRYLOO_MODE_B_RUNTIME/mode-b-keys.json"
          export GRYLOO_COMPOSITION_SMOKE_PROFILE="$GRYLOO_COMPOSITION_PROFILE"
          export GRYLOO_COMPOSITION_MODE=fork
          # The three files share one Anvil fork; the compiler file temporarily replaces Position Manager code inside a
          # snapshot, so the reconciler's code-identity read must not run concurrently with it.
          pnpm exec vitest run packages/reference-compiler/test/composition.fork.test.ts packages/reference-executor/test/composition.fork.test.ts packages/reference-reconciler/test/composition.fork.test.ts --no-file-parallelism --testTimeout=120000
          node scripts/guarded-release-browser.mjs composition

      - name: Summarize screenshot differences after a browser failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/summarize-screenshot-diffs.py apps/reference-dapp/test-results

      - name: Upload browser failure artifacts (screenshots, error context, diagnostic traces, JUnit, profile timings)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-005-visual-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/reference-dapp/test-results/**/*-actual.png
            apps/reference-dapp/test-results/**/*-expected.png
            apps/reference-dapp/test-results/**/*-diff.png
            apps/reference-dapp/test-results/**/test-failed-*.png
            apps/reference-dapp/test-results/**/error-context.md
            apps/reference-dapp/test-results/**/trace.zip
            apps/reference-dapp/test-results/junit/*.xml
            apps/reference-dapp/test-results/guarded-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate and remove ephemeral CycloneDX 1.6 SBOM
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci-observe.sh 'SBOM'
          pnpm sbom --sbom-format cyclonedx --sbom-spec-version 1.6 --lockfile-only --out "$RUNNER_TEMP/build-003a.cdx.json"
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, sys
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'build-003a.cdx.json'
          try:
              document=json.loads(path.read_text())
              if document.get('bomFormat')!='CycloneDX' or document.get('specVersion')!='1.6':
                  raise SystemExit('Unexpected SBOM format or version')
              evidence=json.loads((path.parent/'build-002-dependencies.json').read_text())
              expected={(r['name'],r['version']):r['license'] for r in evidence}
              if len(evidence)!=295 or len(expected)!=295:
                  raise SystemExit('Dependency evidence count changed')
              components=document.get('components')
              if not isinstance(components,list):
                  raise SystemExit('SBOM components missing')
              seen=set()
              for component in components:
                  name=(component.get('group')+'/' if component.get('group') else '')+component.get('name','')
                  identity=(name,component.get('version'))
                  if identity not in expected or identity in seen:
                      raise SystemExit('Unreviewed or duplicate SBOM component: '+repr(identity))
                  seen.add(identity)
                  expression=expected[identity]
                  if ' AND ' in expression:
                      component['licenses']=[{'expression':expression}]
                  else:
                      component['licenses']=[{'license':{'id':expression}}]
              if seen!=set(expected):
                  raise SystemExit('SBOM omits reviewed lock components')
              root_component=document.get('metadata',{}).get('component',{})
              if (root_component.get('name')!='defi-workflow-engine' or
                      root_component.get('version')!='0.1.0' or
                      root_component.get('licenses')!=[{'license':{'id':'Apache-2.0'}}]):
                  raise SystemExit('SBOM root identity or license differs')
              workspace={
                  'package.json':('defi-workflow-engine','Apache-2.0'),
                  'packages/workflow-contracts/package.json':('@defi-workflow-engine/workflow-contracts','Apache-2.0'),
                  'packages/action-registry/package.json':('@defi-workflow-engine/action-registry','Apache-2.0'),
                  'packages/reference-linter/package.json':('@defi-workflow-engine/reference-linter','AGPL-3.0-only'),
                  'packages/reference-compiler/package.json':('@defi-workflow-engine/reference-compiler','AGPL-3.0-only'),
                  'packages/reference-executor/package.json':('@defi-workflow-engine/reference-executor','AGPL-3.0-only'),
                  'packages/reference-reconciler/package.json':('@defi-workflow-engine/reference-reconciler','AGPL-3.0-only'),
                  'packages/cloud-runtime/package.json':('@defi-workflow-engine/cloud-runtime','AGPL-3.0-only'),
                  # BUILD-DEVELOPER-001: the thin Developer API client (zero dependencies, empty lock importer).
                  'packages/developer-sdk/package.json':('@defi-workflow-engine/developer-sdk','Apache-2.0'),
                  'apps/reference-dapp/package.json':('@defi-workflow-engine/reference-dapp','AGPL-3.0-only'),
              }
              for manifest_path,(name,license_id) in workspace.items():
                  manifest=json.loads(pathlib.Path(manifest_path).read_text())
                  expected_version='0.3.0' if manifest_path=='packages/workflow-contracts/package.json' else '0.1.0'
                  if (manifest.get('name'),manifest.get('version'),manifest.get('private'),manifest.get('license'))!=(name,expected_version,True,license_id):
                      raise SystemExit('Workspace manifest inventory differs: '+manifest_path)
              lock=pathlib.Path('pnpm-lock.yaml').read_text()
              importer_section=lock.split('\nimporters:\n',1)[1].split('\npackages:\n',1)[0]
              import re
              # An importer without dependencies is written on one line (`  path: {}`).
              importer_paths=set(re.findall(r'(?m)^  (\S[^\n:]*):(?: \{\})?$',importer_section))
              if importer_paths!={'.','packages/workflow-contracts','packages/action-registry','packages/reference-linter','packages/reference-compiler','packages/reference-executor','packages/reference-reconciler','packages/cloud-runtime','packages/developer-sdk','apps/reference-dapp'}:
                  raise SystemExit('Workspace lock importer inventory differs')
              component_refs={component['bom-ref'] for component in components}
              if len(component_refs)!=295 or root_component.get('bom-ref') in component_refs:
                  raise SystemExit('SBOM component references differ')
              dependencies=document.get('dependencies')
              if not isinstance(dependencies,list):
                  raise SystemExit('SBOM dependency graph missing')
              graph_refs=[entry.get('ref') for entry in dependencies]
              all_refs=component_refs|{root_component['bom-ref']}
              if len(graph_refs)!=len(set(graph_refs)) or set(graph_refs)!=all_refs:
                  raise SystemExit('SBOM dependency reference inventory differs')
              for entry in dependencies:
                  targets=entry.get('dependsOn',[])
                  if not isinstance(targets,list) or len(targets)!=len(set(targets)) or set(targets)-all_refs:
                      raise SystemExit('Invalid SBOM dependency references')
              # pnpm 11.22.0 omits workspace components; the exact ten local
              # manifests and lock importers above are checked independently.
              if re.search(r'(?m)^  packages/developer-sdk: \{\}$',importer_section) is None:
                  raise SystemExit('Developer SDK must have no dependencies')

              reviewed={
                  '@img/sharp-libvips-darwin-arm64','@img/sharp-libvips-darwin-x64',
                  '@img/sharp-libvips-linux-arm','@img/sharp-libvips-linux-arm64',
                  '@img/sharp-libvips-linux-ppc64','@img/sharp-libvips-linux-riscv64',
                  '@img/sharp-libvips-linux-s390x','@img/sharp-libvips-linux-x64',
                  '@img/sharp-libvips-linuxmusl-arm64','@img/sharp-libvips-linuxmusl-x64',
                  '@img/sharp-wasm32','@img/sharp-win32-arm64',
                  '@img/sharp-win32-ia32','@img/sharp-win32-x64',
                  'caniuse-lite','tslib'}
              if {name for name,version in seen if name in reviewed}!=reviewed:
                  raise SystemExit('Reviewed exception package set changed in SBOM')
              raw=(json.dumps(document,indent=2,sort_keys=True)+'\n').encode()
              path.write_bytes(raw)
              checked=json.loads(path.read_text())
              for component in checked['components']:
                  name=(component.get('group')+'/' if component.get('group') else '')+component['name']
                  license_value=component['licenses'][0]
                  actual=license_value.get('expression',license_value.get('license',{}).get('id'))
                  if actual!=expected[(name,component['version'])]:
                      raise SystemExit('SBOM license expression changed: '+name)
              message='Ephemeral CycloneDX 1.6 SBOM: 295 exact registry components, zero workspace components (ten exact manifests and importers checked separately), 16 reviewed exceptions with actual licenses, SHA-256 '+hashlib.sha256(raw).hexdigest()
              print(message)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as summary:
                  summary.write(message+'\n')
          finally:
              path.unlink(missing_ok=True)
          PYCODE

      - name: Verify the certification ledger (every required stage and planned browser profile passed)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci-observe.py verify

      - name: CI timing summary after failure
        if: failure()
        shell: bash
        env:
          FLOFI_ARCHIVE_CACHE_HIT: ${{ steps.archives.outputs.cache-hit }}
        run: |
          set -euo pipefail
          python3 scripts/ci-observe.py summary

      - name: CI timing summary after success
        shell: bash
        env:
          FLOFI_ARCHIVE_CACHE_HIT: ${{ steps.archives.outputs.cache-hit }}
        run: |
          set -euo pipefail
          python3 scripts/ci-observe.py summary
